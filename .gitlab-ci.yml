image: node:22

stages:
  - install
  - test
  - build
  - deploy

variables:
  # GLOBAL VARIABLES
  # AWS_ROLE_ARN: "arn:aws:iam::123456789012:role/GitLabRunnerRole" # Configure in Project Settings > CI/CD > Variables
  # AWS_REGION: "us-east-1"
  CI_NODE_ENV: "qa" # Default to QA/Staging environment for generic jobs

cache:
  paths:
    - node_modules/
    - infra/node_modules/

# ---------------------------------------------------------------------------
# INSTALL & CHECK
# ---------------------------------------------------------------------------
install_deps:
  stage: install
  script:
    - npm ci
    # Install infra deps
    - cd infra && npm ci
  artifacts:
    paths:
      - node_modules/
      - infra/node_modules/
    expire_in: 1 hour

lint_and_test:
  stage: test
  dependencies:
    - install_deps
  script:
    - npm run lint
    - npm run typecheck
    # - npm run test # Uncomment when tests are stable

# ---------------------------------------------------------------------------
# BUILD (APP)
# ---------------------------------------------------------------------------
build_app:
  stage: build
  dependencies:
    - install_deps
  script:
    - echo "Building App..."
    # If you have env vars for the build, inject them here
    # e.g., export VITE_API_URL=$STAGING_API_URL
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# DEPLOY (CDK)
# ---------------------------------------------------------------------------

# Helper script to setups AWS profile via OIDC
.aws_oidc_setup: &aws_oidc_setup
  - echo "Configuring AWS Credentials via OIDC..."
  - |
    if [ -z "$AWS_ROLE_ARN" ]; then
      echo "Error: AWS_ROLE_ARN variable is not set."
      echo "Please configure it in GitLab > Settings > CI/CD > Variables."
      echo "Or uncomment it in .gitlab-ci.yml for testing."
      exit 1
    fi
  - apt-get update && apt-get install -y awscli
  - mkdir -p ~/.aws
  - echo "[default]" > ~/.aws/config
  - echo "region = ${AWS_REGION}" >> ~/.aws/config
  - echo "output = json" >> ~/.aws/config
  # Assume Role using the Web Identity Token provided by GitLab
  - >
    aws sts assume-role-with-web-identity
    --role-arn ${AWS_ROLE_ARN}
    --role-session-name "GitLabRunner-${CI_COMMIT_SHORT_SHA}"
    --web-identity-token ${GITLAB_OIDC_TOKEN}
    > /tmp/aws_creds
  - export AWS_ACCESS_KEY_ID=$(cat /tmp/aws_creds | grep AccessKeyId | cut -d'"' -f4)
  - export AWS_SECRET_ACCESS_KEY=$(cat /tmp/aws_creds | grep SecretAccessKey | cut -d'"' -f4)
  - export AWS_SESSION_TOKEN=$(cat /tmp/aws_creds | grep SessionToken | cut -d'"' -f4)
  - aws sts get-caller-identity

deploy_staging:
  stage: deploy
  environment:
    name: staging
    url: https://staging.ryanrentfro.com
  dependencies:
    - install_deps
    - build_app
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com

  script:
    - *aws_oidc_setup
    - export AWS_REGION=us-east-1  # Force region to match CDK/CloudFront requirement
    - cd infra
    # Deploy the Infrastructure
    - npx cdk deploy StagingStack --require-approval never
    # Sync the built assets
    - BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name portfolio-2026-staging --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
    - echo "Deploying to Bucket $BUCKET_NAME"
    - aws s3 sync ../dist s3://$BUCKET_NAME --delete
    # Invalidate CloudFront
    - DIST_ID=$(aws cloudformation describe-stacks --stack-name portfolio-2026-staging --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
    - aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"

deploy_prod:
  stage: deploy
  environment:
    name: production
    url: https://ryanrentfro.com
  dependencies:
    - install_deps
    - build_app
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - *aws_oidc_setup
    - export AWS_REGION=us-east-1  # Force region to match CDK/CloudFront requirement
    - cd infra
    - npx cdk deploy ProdStack --require-approval never
    - BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name portfolio-2026-prod --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
    - echo "Deploying to Bucket $BUCKET_NAME"
    - aws s3 sync ../dist s3://$BUCKET_NAME --delete
    - DIST_ID=$(aws cloudformation describe-stacks --stack-name portfolio-2026-prod --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
    - aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # Protection
